[project]
name = "rag-citation-agent"
version = "0.1.0"
description = "RAG agent with citation grounding: verified citations, confidence scoring, and search fallback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-agent = "rag_citation_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_citation_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
